dbt_project:
  outputs:
    dev:
      dbname: olist_db
      host: "{{ env_var('DBT_DB_HOST') }}"
      user: "{{ env_var('DBT_DB_USER') }}"
      pass: "{{ env_var('DBT_DB_PASS') }}"
      port: "{{ env_var('DBT_DB_PORT') | int }}"
      schema: dbt
      threads: 1
      type: postgres
  target: dev